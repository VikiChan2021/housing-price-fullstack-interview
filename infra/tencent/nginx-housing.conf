# Match the base path without a trailing slash so the application can handle its own redirect.
location = /housing {
    proxy_pass http://127.0.0.1:13300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Disable proxy buffering so dynamic Next.js responses and failures reach the client promptly.
    proxy_buffering off;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

# ^~ prevents unrelated regex locations from intercepting application assets or BFF routes.
location ^~ /housing/ {
    proxy_pass http://127.0.0.1:13300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Preserve original request context for absolute URL and security-aware framework behavior.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}
