[project]
name = "housing-price-estimator-api"
version = "0.1.0"
description = "Estimator business API for the housing price interview project"
requires-python = "==3.12.*"
dependencies = [
  "fastapi[standard]==0.139.2",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "openapi-spec-validator==0.9.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.3",
]

[tool.uv]
package = false
required-version = "==0.11.32"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
# Branch coverage includes every downstream failure category and readiness branch.
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# Strict typing verifies the Protocol-based ML client and Pydantic orchestration boundary.
python_version = "3.12"
strict = true
packages = ["app"]
