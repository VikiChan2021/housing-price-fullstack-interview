[project]
name = "housing-price-ml-api"
version = "0.1.0"
description = "Model training and inference service for the housing price interview project"
requires-python = "==3.12.*"
dependencies = [
  "fastapi[standard]==0.139.2",
  "joblib==1.5.3",
  "numpy==2.4.3",
  "scikit-learn==1.9.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.0",
  "openapi-spec-validator==0.9.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.3",
]

[tool.uv]
package = false
required-version = "==0.11.32"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["joblib", "sklearn", "sklearn.*"]
ignore_missing_imports = true
