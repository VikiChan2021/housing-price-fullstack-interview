spring:
  application:
    name: market-api
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

market:
  data-path: ${MARKET_DATA_PATH:../../data/raw/House Price Dataset.csv}
  cache-ttl-seconds: ${MARKET_CACHE_TTL_SECONDS:300}
  cache-max-entries: ${MARKET_CACHE_MAX_ENTRIES:256}

ml-api:
  base-url: ${ML_API_BASE_URL:http://ml-api:8000}
  timeout-seconds: ${ML_API_TIMEOUT_SECONDS:5}
