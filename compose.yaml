name: housing-price-interview

# Health-gated dependency order is ML -> business APIs -> same-origin Web portal.
services:
  ml-api:
    build:
      context: .
      dockerfile: services/ml-api/Dockerfile
    image: housing-price-ml-api:local
    ports:
      # Loopback binding exposes local tools without accepting remote host traffic.
      - "127.0.0.1:${ML_API_PORT:-8000}:8000"
    init: true
    mem_limit: "${ML_API_MEMORY_LIMIT:-320m}"
    restart: unless-stopped

  estimator-api:
    build:
      context: .
      dockerfile: services/estimator-api/Dockerfile
    image: housing-price-estimator-api:local
    environment:
      ML_API_BASE_URL: http://ml-api:8000
      ML_API_TIMEOUT_SECONDS: "${ML_API_TIMEOUT_SECONDS:-5}"
    ports:
      - "127.0.0.1:${ESTIMATOR_API_PORT:-8001}:8001"
    depends_on:
      ml-api:
        # Container creation is insufficient; the artifact-backed endpoint must be healthy.
        condition: service_healthy
    init: true
    mem_limit: "${ESTIMATOR_API_MEMORY_LIMIT:-192m}"
    restart: unless-stopped

  market-api:
    build:
      context: .
      dockerfile: services/market-api/Dockerfile
    image: housing-price-market-api:local
    environment:
      ML_API_BASE_URL: http://ml-api:8000
      ML_API_TIMEOUT_SECONDS: "${ML_API_TIMEOUT_SECONDS:-5}"
      MARKET_CACHE_TTL_SECONDS: "${MARKET_CACHE_TTL_SECONDS:-300}"
      MARKET_CACHE_MAX_ENTRIES: "${MARKET_CACHE_MAX_ENTRIES:-256}"
    ports:
      - "127.0.0.1:${MARKET_API_PORT:-8080}:8080"
    depends_on:
      ml-api:
        condition: service_healthy
    init: true
    mem_limit: "${MARKET_API_MEMORY_LIMIT:-640m}"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Next.js embeds the public base path during build, so it is also a build argument.
        NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH:-}"
    image: housing-price-web:local
    environment:
      ESTIMATOR_API_BASE_URL: http://estimator-api:8001
      MARKET_API_BASE_URL: http://market-api:8080
      NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH:-}"
      WEB_API_TIMEOUT_SECONDS: "${WEB_API_TIMEOUT_SECONDS:-10}"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      estimator-api:
        # Web readiness aggregates both business services and starts only after their health checks.
        condition: service_healthy
      market-api:
        condition: service_healthy
    init: true
    mem_limit: "${WEB_MEMORY_LIMIT:-256m}"
    restart: unless-stopped
